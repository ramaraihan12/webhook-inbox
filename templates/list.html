{% extends "base.html" %}
{% block title %}Deliveries - webhook-inbox{% endblock %}
{% block content %}
<h1>Deliveries</h1>

<form class="filters" data-poll hx-get="/ui/rows" hx-target="#rows" hx-trigger="every 5s" hx-include="#page-state" hx-push-url="false">
  <label>Source
    <select name="source" hx-get="/ui/rows" hx-trigger="change" hx-include="closest form" hx-vals='{"page": "0"}'>
      <option value="">all</option>
      {% for s in sources %}
      <option value="{{ s }}" {% if *s == source %}selected{% endif %}>{{ s }}</option>
      {% endfor %}
    </select>
  </label>
  <label>Status
    <select name="status" hx-get="/ui/rows" hx-trigger="change" hx-include="closest form" hx-vals='{"page": "0"}'>
      <option value="">all</option>
      {% for s in statuses %}
      <option value="{{ s }}" {% if *s == status %}selected{% endif %}>{{ s }}</option>
      {% endfor %}
    </select>
  </label>
</form>

<div id="rows">
  {% include "rows.html" %}
</div>
{% endblock %}
