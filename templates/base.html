<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="htmx-config" content='{"includeIndicatorStyles": false, "allowEval": false}'>
  <title>{% block title %}webhook-inbox{% endblock %}</title>
  <link rel="stylesheet" href="/ui/static/app.css">
  <script src="/ui/static/htmx.min.js" defer></script>
</head>
<body>
  <header class="top">
    <a class="brand" href="/ui">webhook-inbox</a>
    <nav>
      <a href="/ui" {% if nav == "deliveries" %}aria-current="page"{% endif %}>Deliveries</a>
      <a href="/ui/dead" {% if nav == "dead" %}aria-current="page"{% endif %}>Dead letters</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>Times are UTC. Demo data on this page is made up.</footer>
</body>
</html>
